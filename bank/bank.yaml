# STORIES — the long form of the same work. Never rendered on the resume (that
# stays one line per bullet); this is the material for interviews, recruiter
# messages and cover letters, where the before/after tension is what lands.
# Same frozen-facts rule: nothing here that did not happen.
stories:
  - id: pricing-ssot
    title: "Variable listener pricing: many sources of truth down to one"
    demonstrates: [single-source-of-truth, separation-of-concerns, solid, oop, refactoring, config-driven-design]
    bullets: [pricing-ssot, pricing-fanout, pricing-config-switch]
    before: "Spending and earning rates were resolved per user from several places at once — some rows in the database, some values hardcoded in service code, some in config. Every feature that needed a rate worked it out its own way, so two features could disagree about what a listener costs."
    action: "When the product introduced variable listener pricing across the platform, I rebuilt the path instead of patching it. Rates now come from one owner, and feed, session rates, inbox, search feed, auto-connect and listener recommendations all read from that."
    after: "A business rate change is a single config edit, and caches refresh across every consumer. No feature can drift from another, and nobody has to remember the six places a rate used to live."
    use_when: "the JD mentions clean or modular code, OOP, SOLID, design patterns, maintainability, refactoring or system design"

  - id: wallet-live-balance
    title: "Post-payment wallet balance: a full app refresh down to one pushed event"
    demonstrates: [customer-obsession, event-driven-design, performance, real-time, ownership]
    bullets: [wallet-live-balance, wallet-credit-event]
    before: "A user who paid through the payment gateway came back to the app and the whole app refreshed just to show the new wallet balance. Every top-up cost a full reload — the client re-fetched everything to update one number, and the user watched it happen."
    action: "I moved it onto the real-time path we already owned. The wallet service now publishes an event on payment success, the real-time service delivers it to that user's open WebSocket, and the Android client listens on a real-time flow and updates the balance in place."
    after: "The balance updates the moment the payment lands, with no reload. The client stops re-fetching everything to change one field, so the work drops on both sides and the top-up feels instant instead of interrupting."
    use_when: "the JD mentions real-time, WebSockets, event-driven systems, payments or wallets, client performance, or customer experience"

  # The answer to "tell me about a time you decided NOT to do something." The
  # fix here was small; the judgment was in scoping it. Keep both halves when
  # telling it — the cliff alone is a bug report, the boundary call is the story.
  - id: pricing-window-scope
    title: "A pricing cliff, and the change I deliberately did not make"
    demonstrates: [dive-deep, are-right-a-lot, blast-radius, separation-of-concerns, ownership, config-driven-design]
    bullets: [pricing-window-cliff, pricing-scope-guard]
    before: "New users got a discounted rate for their first day, but the window was measured from the moment they recharged. Someone who recharged at 23:50 IST got ten minutes of it. Someone who recharged twenty minutes later got a full day. Same offer, same product, and the only thing separating them was the clock — a cliff nobody had noticed because it only hurt people who paid late at night."
    action: "The obvious fix was to flip the user's segment field in the shared user service and let every consumer read the longer window. I did not do that. Listener cooldown reads the same field, and changing its meaning would have quietly changed cooldown behaviour with nothing to catch it — no test asserts a field means what it meant last week. So I scoped the change to the pricing layer instead: the window became three IST calendar days, configurable per environment without a release, and the shared field kept its original meaning. Because the two services still had to agree, I sequenced the rollout — the user service PR landed before the pricing service PR, never the other way round."
    after: "The cliff is gone and the window is a config value, so changing it later costs no deploy. Cooldown behaves exactly as it did. The part worth saying out loud in an interview is the restraint: the one-line fix in the shared service would have worked on the day I shipped it and broken something unrelated weeks later, with nobody able to trace it back."
    use_when: "the JD mentions system design, service boundaries, shared services, migrations, blast radius, or asks for a judgement call — and for any 'what would you do differently / what did you decide not to do' question"

