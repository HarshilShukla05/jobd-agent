# STORIES — the long form of the same work. Never rendered on the resume (that
# stays one line per bullet); this is the material for interviews, recruiter
# messages and cover letters, where the before/after tension is what lands.
# Same frozen-facts rule: nothing here that did not happen.
stories:
  - id: pricing-ssot
    title: "Variable listener pricing: many sources of truth down to one"
    demonstrates: [single-source-of-truth, separation-of-concerns, solid, oop, refactoring, config-driven-design]
    bullets: [pricing-ssot, pricing-fanout, pricing-config-switch]
    before: "Spending and earning rates were resolved per user from several places at once — some rows in the database, some values hardcoded in service code, some in config. Every feature that needed a rate worked it out its own way, so two features could disagree about what a listener costs."
    action: "When the product introduced variable listener pricing across the platform, I rebuilt the path instead of patching it. Rates now come from one owner, and feed, session rates, inbox, search feed, auto-connect and listener recommendations all read from that."
    after: "A business rate change is a single config edit, and caches refresh across every consumer. No feature can drift from another, and nobody has to remember the six places a rate used to live."
    use_when: "the JD mentions clean or modular code, OOP, SOLID, design patterns, maintainability, refactoring or system design"

