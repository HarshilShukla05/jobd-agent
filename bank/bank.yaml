# FACTS ARE FROZEN. The LLM selects bullet IDs and approved aliases only; it never
# writes or edits prose. Style: one line, clean simple English, <=105 chars per bullet.
# Sources: resume-4.PDF + FRD work summary doc (both 2026-07-22) — validated by Harshil: PENDING.
# OPEN QUESTION for Harshil: FRD doc says "Oct 2024 - Jul 2025" but resume says intern
# Jul-Sep 2025 / SE1 Oct 2025-present — resolve before these bullets ship on a resume.
# A bullet's `conflicts` lists bullets describing the same underlying work — the
# renderer rejects a selection containing both.
#
# NO SELF-DOWNGRADING (Harshil, 2026-08-05). Honesty here means never inventing a
# fact. It does NOT mean arguing against himself on his own document. So:
#   - no hedging words that shrink a real skill ("basic", "fundamentals",
#     "familiar with", "exposure to", "some experience in")
#   - no apologising for a gap, and no naming a gap the JD did not ask about
#   - no bullet that describes a limitation rather than work he did
# A skill he genuinely has is stated plainly. A skill he lacks is simply absent —
# omission is the honest move, self-criticism is not.
#
# NO REDUNDANT BULLETS, NO BULLETS WITHOUT NUMBERS (Harshil, 2026-08-07).
# Two rules the selector must apply on every job, not just when it notices:
#   1. Never select two bullets that make the same point. Two lines describing
#      one piece of work read as padding and waste a slot on a one-page resume.
#      Where two bullets are two views of the same thing, they carry `conflicts`
#      and the renderer rejects the pair — but the selector must not rely on that
#      as the only guard, because closely-related-but-not-identical bullets slip
#      through. Ask of each pair: could a reader tell these apart? If not, drop one.
#   2. Prefer bullets that quantify. A bullet with a number (throughput, latency,
#      volume, count, time saved, before -> after) outranks one without, and a
#      metric-free bullet should only make the page when nothing better covers a
#      point the JD asks for. "Impact" means numbers, not adjectives.
# Neither rule licenses inventing a figure. If a bullet needs a number that is
# not in this file, ask Harshil for it — do not estimate one.
#
# NO REPEATED WORDS IN ONE BREATH (Harshil, 2026-08-07).
# Never use the same distinctive word twice inside one sentence, or in two lines
# sitting next to each other. "Backend engineer ... on the backend of a chat app"
# spends two of the summary's ~35 words saying one thing. Every repeat is a slot
# that could have carried a new fact.
# The fix is almost never to delete the second use — it is to make the FIRST word
# do different work. Here: open with "Software Engineer" (his real title, which
# the resume otherwise never states in the summary) and let "on the backend of"
# carry the specialism. One sentence, two facts, same length.
# Note this is about distinctive words in adjacent text, NOT about keywords
# recurring across the page. "payments" appearing in five separate bullets is
# correct and helps the ATS; "backend ... backend" in one sentence is waste.
# resumegen warns on within-sentence repeats at render time — a prose rule alone
# already failed once, when two pricing bullets both shipped saying "six".

